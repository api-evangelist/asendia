description: Asendia is a global cross-border e-commerce shipping and international mail carrier, a joint venture between La Poste and Swiss Post. Its US arm, Asendia USA, publishes the A1 Web Services
  as public OpenAPI 3.0 documents (parcel, shipping platform, tracking, PUDO locator, fulfillment and more) at a1api.asendiausa.com; the Asendia Sync shipping platform (asendia-sync.com) exposes an API
  whose Swagger documentation requires authentication.
