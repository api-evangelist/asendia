openapi: 3.2.0
info:
  title: Asendia Tracking API
  contact:
    name: Asendia USA Web Service Team for any questions or comments.
    email: john.mcshane@asendia.com;chris.joiner@asendia.com;katie.vogt@asendia.com;ammi.cabrera@asendia.com
  version: '1.0'
  description: 'Operations tagged Tracking across 4 of this provider''s published API definitions: asendia-a1-tracking-swagger.json, asendia-a1-tracking-v2-swagger.json, asendia-a1-tracking-openapi.yml, asendia-a1-tracking-v2-openapi.yml. Each path carries the servers of the definition it was published in.'
tags:
- name: Tracking
paths:
  /api/A1/v1.0/Tracking/Detail:
    get:
      tags:
      - Tracking
      summary: Get api a1 tracking detail
      parameters:
      - name: trackingNumberVendor
        in: query
        description: The tracking number belonging to the package you're looking for details of.
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/getTrackingDetailResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/getTrackingDetailResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/getTrackingDetailResponse'
      x-summary-source: derived
      operationId: getApiA1V10TrackingDetail
      x-operation-id-source: derived
  /api/A1/v1.0/Tracking/Milestone:
    get:
      tags:
      - Tracking
      summary: Get api a1 tracking milestone
      parameters:
      - name: trackingNumberVendor
        in: query
        description: The tracking number belonging to the package you're looking for milestones of.
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/getTrackingMilestoneResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/getTrackingMilestoneResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/getTrackingMilestoneResponse'
      x-summary-source: derived
      operationId: getApiA1V10TrackingMilestone
      x-operation-id-source: derived
  /api/A1/v2.0/Tracking/Detail:
    get:
      tags:
      - Tracking
      summary: Get api a1 tracking detail
      parameters:
      - name: trackingNumberVendor
        in: query
        description: The tracking numbers belonging to the packages you're looking for details of. Accepts up to 10 numbers separated by a comma.
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/trackingDetailListApiResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/trackingDetailListApiResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/trackingDetailListApiResponse'
      x-summary-source: derived
      operationId: getApiA1V20TrackingDetail
      x-operation-id-source: derived
  /api/A1/v2.0/Tracking/Milestone:
    get:
      tags:
      - Tracking
      summary: Get api a1 tracking milestone
      parameters:
      - name: trackingNumberVendor
        in: query
        description: The tracking number belonging to the package you're looking for milestones of. Accepts up to 10 numbers separated by a comma.
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/trackingMilestoneListApiResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/trackingMilestoneListApiResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/trackingMilestoneListApiResponse'
      x-summary-source: derived
      operationId: getApiA1V20TrackingMilestone
      x-operation-id-source: derived
