          nullable: true
          example: ORD12345
        dispatchNumber:
          maxLength: 100
          type: string
          description: "   A number assigned by customer to any grouping of parcels\
            \ from a shipment. This can be leveraged for a variety of purposes:\r\n\
            <br>1. Use dispatchNumber of 0 for any outstanding parcels. Closing the\
            \ dispatch is optional.<br>2. Use customized dispatchNumber. Optionally,\
            \ you can close that dispatchNumber (at the end of the day or whenever\
            \ you want to physically ship) and it will close all the parcels that\
            \ are part of that dispatchNumber. (Please note: that dispatchNumber can\
            \ not be used again)<br>3. Use parcelID as the dispatchNumber. Optionally,\
            \ you can close that dispatchNumber after receiving label and it will\
            \ close out only that package."
          nullable: true
          example: PAR202309060001
        parcelId:
          maxLength: 35
          minLength: 4
          type: string
          description: Unique identifier given by customer to each physical parcel.
