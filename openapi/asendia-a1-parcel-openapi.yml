openapi: 3.0.1
info:
  title: A1 Web Services
  description: These are all the APIs needed to handle Parcel v1.0
  contact:
    name: Asendia USA Web Service Team for any questions or comments.
    email: john.mcshane@asendia.com;chris.joiner@asendia.com;katie.vogt@asendia.com;ammi.cabrera@asendia.com
  version: Parcel v1.0
paths:
  /api/A1/CloseShipment/CloseShipment:
    post:
      tags:
      - CloseShipment
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/closeShipmentRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/closeShipmentRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/closeShipmentRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/closeShipmentRequest'
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/postCloseShipmentResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/postCloseShipmentResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/postCloseShipmentResponse'
  /api/A1/CloseShipment/CloseDAShipment:
    post:
      tags:
      - CloseShipment
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/CloseDAShipmentsRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/CloseDAShipmentsRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/CloseDAShipmentsRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/CloseDAShipmentsRequest'
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/postCloseDAShipmentResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/postCloseDAShipmentResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/postCloseDAShipmentResponse'
  /api/A1/v1.0/Parcel/CreateParcel:
    post:
      tags:
      - Parcel
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/postParcelRequestModel'
          application/json:
            schema:
              $ref: '#/components/schemas/postParcelRequestModel'
          text/json:
            schema:
              $ref: '#/components/schemas/postParcelRequestModel'
          application/*+json:
            schema:
              $ref: '#/components/schemas/postParcelRequestModel'
      responses:
        '204':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/postParcelResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/postParcelResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/postParcelResponse'
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/postParcelResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/postParcelResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/postParcelResponse'
  /api/A1/v1.0/Parcel/CustomerCreateParcel:
    post:
      tags:
      - Parcel
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/postCustomerParcelRequestModel'
          application/json:
            schema:
              $ref: '#/components/schemas/postCustomerParcelRequestModel'
          text/json:
            schema:
              $ref: '#/components/schemas/postCustomerParcelRequestModel'
          application/*+json:
            schema:
              $ref: '#/components/schemas/postCustomerParcelRequestModel'
      responses:
        '204':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/postParcelResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/postParcelResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/postParcelResponse'
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/postParcelResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/postParcelResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/postParcelResponse'
  /api/A1/v1.0/Parcel/UKCreateParcel:
    post:
      tags:
      - Parcel
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/postUKParcelRequestModel'
          application/json:
            schema:
              $ref: '#/components/schemas/postUKParcelRequestModel'
          text/json:
            schema:
              $ref: '#/components/schemas/postUKParcelRequestModel'
          application/*+json:
            schema:
              $ref: '#/components/schemas/postUKParcelRequestModel'
      responses:
        '200':
          description: Success
    put:
      tags:
      - Parcel
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/postUKParcelRequestModel'
          application/json:
            schema:
              $ref: '#/components/schemas/postUKParcelRequestModel'
          text/json:
            schema:
              $ref: '#/components/schemas/postUKParcelRequestModel'
          application/*+json:
            schema:
              $ref: '#/components/schemas/postUKParcelRequestModel'
      responses:
        '200':
          description: Success
  /api/A1/v1.0/Parcel/DeleteParcel:
    put:
      tags:
      - Parcel
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/deleteParcelRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/deleteParcelRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/deleteParcelRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/deleteParcelRequest'
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/responseStatus'
            application/json:
              schema:
                $ref: '#/components/schemas/responseStatus'
            text/json:
              schema:
                $ref: '#/components/schemas/responseStatus'
components:
  schemas:
    shipmentsToClose:
      type: object
      properties:
        trackingNumber:
          maxLength: 50
          minLength: 0
          type: string
          description: trackingNumber of a Parcel (retrieved from Create Parcel)
          nullable: true
        packageId:
          maxLength: 50
          minLength: 0
          type: string
          description: packageId
          nullable: true
        orderNumber:
          maxLength: 50
          type: string
          description: "orderNumber (provided by customer in Create Parcel)\r\nIf\
            \ several parcels have the same order number, they will all be closed\
            \ except if a parcel was closed before"
          nullable: true
        containerNumber:
          maxLength: 50
          type: string
          description: "containerNumber (provided by Create Container)\r\nYou must\
            \ provide at least one number and number types cannot be mixed: only trackingNumbers,\
            \ or only orderNumbers, or only dispatchNumbers, or only containerNumbers"
          nullable: true
        dispatchNumber:
          maxLength: 100
          type: string
          description: "dispatchNumber (provided by customer in Create Parcel)\r\n\
            You must provide at least one number and number types cannot be mixed:\
            \ only trackingNumbers, or only orderNumbers, or only dispatchNumbers,\
            \ or only containerNumbers"
          nullable: true
      additionalProperties: false
    closeShipmentRequestModel:
      required:
      - accountNumber
      - pickupCarrier
      type: object
      properties:
        accountNumber:
          maxLength: 12
          type: string
          description: Asendia's account number designated for the shipper. This will
            be provided at account setup.
        subAccountNumber:
          maxLength: 12
          type: string
          description: Asendia's sub account number designated for the shipper, if
            applicable. This will be provided at account setup.
          nullable: true
        shippingLocation:
          type: string
          description: "The location customer is shipping from: either customer drops\
            \ off parcels from this shipping location to Asendia processing location\
            \ or Asendia picks up parcels at this designated shipping location\r\n\
            For each customer each location has a unique code and one of them is set\
            \ as default location.\r\nFor the default location, DEFAULT value can\
            \ be used instead of location code which makes setup easier for customers\
            \ with a unique location.\r\nIf customer has several locations, field\
            \ must be populated with the code of the location provided during onboarding\
            \ phase."
          nullable: true
        processingPoint:
          type: string
          nullable: true
        isDirectAccess:
          type: boolean
          nullable: true
        pickupCarrier:
          type: string
          description: "The Asendia's location in where the physical package will\
            \ be processed.\r\nEquivalent of \"Pickup Carrier\" field from Job creation\
            \ but using codes rather than free text.\r\n- if customer drops himself\
            \ shipments to processsing location, then pickupCarrier=CUSTDROPOFF (*)\r\
            \n- if a pickup is requested, then pickupCarrier=ASPICKUP (*)\r\n- if\
            \ Direct Access, then pickupCarrier=DIRECTA\r\n- if other carrier is concerned,\
            \ use related code"
        trackingIdentifier:
          type: string
          description: Can be used in case of customer drop-off if a carrier is used
            for transport and provides a tracking number/identifier. Customer and
            Asendia can accordinglyu track shipment from customer location to Asendia
            processing location
          nullable: true
        transportReference:
          type: string
          description: Used for Direct Access to capture transport or shipping reference
            such as MAWB number
          nullable: true
        customerReferenceNumber1:
          maxLength: 50
          type: string
          description: Users have the option of entering notes for their own purposes
            in these three fields.  Any notes entered will display on the shipping
            control document (SCD), reports, and invoices.
          nullable: true
        customerReferenceNumber2:
          maxLength: 50
          type: string
          description: Users have the option of entering notes for their own purposes
            in these three fields.  Any notes entered will display on the shipping
            control document (SCD), reports, and invoices.
          nullable: true
        customerReferenceNumber3:
          maxLength: 50
          type: string
          description: Users have the option of entering notes for their own purposes
            in these three fields.  Any notes entered will display on the shipping
            control document (SCD), reports, and invoices.
          nullable: true
        dhlbolNumber:
          type: string
          description: ''
          nullable: true
        shipmentsToClose:
          type: array
          items:
            $ref: '#/components/schemas/shipmentsToClose'
          description: "See shipmentsToClose object\r\nArray - list of parcels or\
            \ orders or receptacles/containers or dispatches to be closed\r\nMust\
            \ contain at least one number\r\nEach shipment can be identified using\
            \ one of the following number types:\r\n- trackingNumber of a Parcel (retrieved\
            \ from Create Parcel) if you want to close parcels one by one\r\n- or\
            \ orderNumber (provided by customer in Create Parcel) if you want to close\
            \ parcels using their order numbers - if several parcels have the same\
            \ order number, they will all be closed except if a parcel was closed\
            \ before\r\n- or containerNumber (provided by Create Container) if you\
            \ want to close all parcels within a bag\r\n- or dispatchNumber (provided\
            \ by customer in Create Parcel) if you want to close all parcels nested\
            \ in the same customer dispatch\r\nImportant: don't mix number types in\
            \ the same request so don't provid a mix of tracking numbers and order\
            \ numbers. Provide only tracking numbers or only order numbers or only\
            \ dispatch numbers or only container numbers"
          nullable: true
      additionalProperties: false
    closeShipmentRequest:
      type: object
      properties:
        closeShipmentsRequest:
          allOf:
          - $ref: '#/components/schemas/closeShipmentRequestModel'
          nullable: true
      additionalProperties: false
    weightUnitEnum:
      enum:
      - Lb
      - Lbs
      - Kg
      - Kgs
      - LB
      - LBS
      - KG
      - KGS
      type: string
    labelTypeEnum:
      enum:
      - PDF
      - PNG
      - ZPL
      - ZPL300
      - ANY
      type: string
      description: Format label return in response
    jobDocument:
      type: object
      properties:
        name:
          type: string
          description: ''
          nullable: true
        type:
          allOf:
          - $ref: '#/components/schemas/labelTypeEnum'
          description: 'Possible values: [ PDF, PNG, ZPL, ANY ]'
        content:
          type: string
          description: ''
          nullable: true
      additionalProperties: false
    closeShipmentResponseModel:
      type: object
      properties:
        jobNumber:
          type: string
          description: Job number automatically assigned by A1
          nullable: true
        jobStatus:
          type: string
          description: Job status. "Not received" if job is properly created (and
            is not direct access), "Not received" if created successfully but pickup
            mising, "Error-not created" or similar if request failed and job is not
            created. Or "Closed" for direct access
          nullable: true
        jobCreationDate:
          type: string
          format: date-time
          nullable: true
        jobProductCode:
          type: string
          description: job Product Code calculated by A1 according to parcels' Product
            Codes in the job
          nullable: true
        jobProductName:
          type: string
          description: job Product name related to Product Code
          nullable: true
        jobQuoteCode:
          type: string
          description: job Quote Code calculated by A1 according to parcels' Quote
            Codes in the job
          nullable: true
        jobQuoteName:
          type: string
          description: job Quote name related to Quote Code
          nullable: true
        jobTotalWeight:
          type: number
          description: job Weight Unit calculated by A1 according to sum of parcelWeights
            of parcels in the job
          format: double
          nullable: true
        jobWeightUnit:
          allOf:
          - $ref: '#/components/schemas/weightUnitEnum'
          description: "job weight unit (Lb or Kg) - same as weightUnit from parcels\
            \ contained in the job.\r\nPossible values: [ Lb, Kg ]"
        jobTotalPieces:
          type: integer
          description: job Total Pieces calculated by A1 according to number or parcels
            in the job
          format: int32
          nullable: true
        isDirectAccess:
          type: boolean
          nullable: true
        packageUsedInAnotherJob:
          type: array
          items:
            type: string
          nullable: true
        jobDocuments:
          type: array
          items:
            $ref: '#/components/schemas/jobDocument'
          description: "See jobDocuments object. Array can contain multiple entries.\r\
            \nContains delivery note (SCD) and possibly some manifests in case of\
            \ Direct Access"
          nullable: true
      additionalProperties: false
    responseStatus:
      type: object
      properties:
        responseStatusCode:
          type: integer
          description: This is used to display the code for the return status.
          format: int32
        responseStatusMessage:
          type: string
          description: This is used for a human readable return status message.
          nullable: true
      additionalProperties: false
      description: Displays the status of the Return
    postCloseShipmentResponse:
      type: object
      properties:
        closeShipment:
          allOf:
          - $ref: '#/components/schemas/closeShipmentResponseModel'
          nullable: true
        responseStatus:
          allOf:
          - $ref: '#/components/schemas/responseStatus'
          nullable: true
      additionalProperties: false
    TransportData:
      type: object
      properties:
        transportReference:
          type: string
          nullable: true
        flightNumber:
          type: string
          nullable: true
        etd:
          type: string
          nullable: true
        eta:
          type: string
          nullable: true
        originPort:
          maxLength: 3
          type: string
          nullable: true
        destinationPort:
          maxLength: 3
          type: string
          nullable: true
      additionalProperties: false
    CloseDAShipmentRequest:
      required:
      - accountNumber
      - manifestDate
      - shipmentsToClose
      type: object
      properties:
        accountNumber:
          maxLength: 12
          type: string
        subAccountNumber:
          maxLength: 12
          type: string
          nullable: true
        shippingLocation:
          type: string
          nullable: true
        processingPoint:
          type: string
          nullable: true
        manifestDate:
          type: string
          description: Expected formats are MM.dd.yyyy or MM/dd/yyyy or yyyy-MM-dd.
        trackingIdentifier:
          type: string
          nullable: true
        transport:
          allOf:
          - $ref: '#/components/schemas/TransportData'
          nullable: true
        customerReferenceNumber1:
          maxLength: 50
          type: string
          nullable: true
        customerReferenceNumber2:
          maxLength: 50
          type: string
          nullable: true
        customerReferenceNumber3:
          maxLength: 50
          type: string
          nullable: true
        dhlbolNumber:
          type: string
          nullable: true
        shipmentsToClose:
          type: array
          items:
            $ref: '#/components/schemas/shipmentsToClose'
      additionalProperties: false
    CloseDAShipmentsRequest:
      type: object
      properties:
        closeDAShipmentRequest:
          allOf:
          - $ref: '#/components/schemas/CloseDAShipmentRequest'
          nullable: true
      additionalProperties: false
    ReportData:
      required:
      - contentData
      - contentSize
      - contentTypeId
      - formatCode
      type: object
      properties:
        name:
          type: string
          nullable: true
        formatCode:
          type: string
        contentTypeId:
          type: integer
          format: int32
        contentTypeName:
          type: string
          nullable: true
        contentSize:
          type: string
        createdOn:
          type: string
          format: date-time
          nullable: true
        createdBy:
          type: string
          nullable: true
        exportedOn:
          type: string
          format: date-time
          nullable: true
        exportedBy:
          type: string
          nullable: true
        friendlyName:
          type: string
          nullable: true
        contentData:
          type: string
        reportId:
          type: integer
          format: int32
        fileName:
          type: string
          nullable: true
        orientation:
          type: string
          nullable: true
        fileLocationPath:
          type: string
          nullable: true
        carrierLabelType:
          type: string
          description: A-Carrier document type when available (e.g. ACL Label.Type).
            Used to distinguish customs documents from shipping labels.
          nullable: true
        isS3File:
          type: boolean
        numberOfCopies:
          type: integer
          format: int32
      additionalProperties: false
    closeDAShipmentResponseModel:
      type: object
      properties:
        jobId:
          type: integer
          format: int32
        jobNumber:
          type: string
          nullable: true
        jobStatus:
          type: string
          nullable: true
        jobCreationDate:
          type: string
          format: date-time
        jobProductCode:
          type: string
          nullable: true
        jobProductName:
          type: string
          nullable: true
        jobQuoteCode:
          type: string
          nullable: true
        jobQuoteName:
          type: string
          nullable: true
        jobTotalWeight:
          type: number
          format: double
          nullable: true
        jobTotalPieces:
          type: integer
          format: int32
        jobWeightUnit:
          allOf:
          - $ref: '#/components/schemas/weightUnitEnum'
        isDirectAccess:
          type: boolean
        packageUsedInAnotherJob:
          type: array
          items:
            type: string
          nullable: true
        receptacleNumbers:
          type: array
          items:
            type: string
          nullable: true
        serviceDispatchNumbers:
          type: array
          items:
            type: string
          nullable: true
        shipmentDispatchNumber:
          type: string
          nullable: true
        receptacleLabels:
          type: array
          items:
            $ref: '#/components/schemas/ReportData'
          nullable: true
      additionalProperties: false
    postCloseDAShipmentResponse:
      type: object
      properties:
        responseStatus:
          allOf:
          - $ref: '#/components/schemas/responseStatus'
          nullable: true
        closeDAShipment:
          allOf:
          - $ref: '#/components/schemas/closeDAShipmentResponseModel'
          nullable: true
      additionalProperties: false
    tradeItemNumberTypeEnum:
      enum:
      - EAN
      - UPC
      - JAN
      - ISBN
      type: string
    articlesModel:
      type: object
      properties:
        sku:
          maxLength: 40
          type: string
          description: 'The item''s SKU number or other searchable product identifier.
            PLEASE NOTE: The SKU max field length is 40 characters but will be truncated
            to 20 characters upon import to Asendia Systems. This means if a SKU is
            22 characters it will import into Asendia systems as 20 characters.'
          nullable: true
          example: BLUW12345678
        articleDescription:
          maxLength: 150
          type: string
          description: The item description that describes what the item is.
          nullable: true
          example: Blue watch
        articleDescriptionCn:
          maxLength: 150
          type: string
          description: Chinese description of the article
          nullable: true
          example: 中文货品
        unitValue:
          maximum: 10000000000
          minimum: 0.01
          type: number
          description: The retail price for a single unit of the product.
          format: double
          nullable: true
          example: 10
        quantity:
          maximum: 1000
          minimum: 0
          type: integer
          description: The total quantity of the product units within the package.
          format: int32
          nullable: true
          example: 1
        unitWeight:
          maximum: 1000
          minimum: 0
          type: number
          description: The total weight for a single unit of the product Related unit
            (Kg or Lb) is defined in field "weightUnit"
          format: double
          nullable: true
          example: 0.1
        countryOfOrigin:
          maxLength: 2
          type: string
          description: 'The 2-character ISO country code in which the product was
            manufactured, as required by international customs specifications. See
            for more information: http://www.iso.org/iso/country_codes'
          nullable: true
          example: DE
        harmonizedCode:
          maxLength: 20
          type: string
          description: The harmonized code required by international customs specifications.
            HS code or HST code ; depends on final carrier and customs requirements
          nullable: true
          example: '910310'
        originPostalCode:
          type: string
          description: The postal code within the country where the product was manufactured.
            Can be requested if countryOfOrigin = CN and destination county = US
          nullable: true
        originManufacturer:
          type: string
          description: The name of the product manufacturer. Can be requested if countryOfOrigin
            = CN and destination county = US
          nullable: true
        destinationTariffCode:
          maxLength: 20
          type: string
          description: Destination tariff code used for import clearance purposes.
            VAT codes for VAT exemptions or reduced VAT can be filled here
          nullable: true
          example: "Exemption codes examples (IE destination):\r\n<br>6VTF = Reduced\
            \ VAT Rate <br>6VTT = Second Reduced VAT Rate <br>6VTA = Agricultural\
            \ VAT Rate <br>6VTZ = Zero VAT Rate "
        productURL:
          maxLength: 255
          type: string
          description: Direct link to the product page
          nullable: true
          example: https://www.acme.com/SKU
        composition:
          type: string
          description: 'Example: 100% polyurethane, Cotton, aluminium'
          nullable: true
          example: 100% polyurethane, Cotton, aluminium
        tradeItemNumber:
          type: string
          description: "GTIN (Global Trade Item Number) or the article or ISBN (International\
            \ Standard Book Number) for Books\r\n<br> GTIN: can be EAN (European Article\
            \ Number) also called GTIN-13 or UPC (Universal Product Code) also called\
            \ GTIN-12 and used in USA and Canada "
          nullable: true
        tradeItemNumberType:
          allOf:
          - $ref: '#/components/schemas/tradeItemNumberTypeEnum'
          description: 'Type of trade item number. Possible value are: EAN, UPC, JAN
            or ISBN'
          nullable: true
        fdaPriorNotice:
          maxLength: 12
          minLength: 12
          type: string
          description: FDA (US Food and Drug Administration) Prior Notice number (12c)
            A Prior Notice declaration must be done for each food or beverage article
            to the USA.
          nullable: true
        hasBattery:
          type: boolean
          description: "Parcel contains batterie True/False\r\n<br>Possible Values:\
            \ true, false (default value if null)"
          nullable: true
          example: false
        dgnFlag:
          type: boolean
          description: "Dangerous Goods (DGN) flag true/false\r\n<br>Possible Values:\
            \ true, false (default value if null)"
          nullable: true
          example: true
        dgnCategory:
          maxLength: 20
          type: string
          description: Dangerous goods category
          nullable: true
          example: Oxidizing substances
        dgnUnNumber:
          maxLength: 20
          type: string
          description: Unique reference for dangerous goods
          nullable: true
          example: UN 1993
        dgnPInumber:
          maxLength: 6
          type: string
          description: Packing Instruction Number used by Ops
          nullable: true
          example: PI 966
        dgnEccn:
          maxLength: 35
          type: string
          description: Export control classification number
          nullable: true
          example: 9E003
        volatileOrganicCompoundInGrams:
          maximum: 2147483647
          minimum: 0
          type: integer
          description: Weight in grams of Volatile Organic Components (VOC) in the
            item. Optional field.
          format: int32
          nullable: true
          example: 150
        dds:
          maxLength: 14
          minLength: 14
          type: string
