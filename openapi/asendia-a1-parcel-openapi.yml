    parcelModel:
      required:
      - dispatchNumber
      - orderNumber
      - parcelId
      - parcelWeight
      - reasonForExport
      - weightUnit
      type: object
      properties:
        orderNumber:
          maxLength: 35
          type: string
          description: The order identifier number. This is the number representing
            all parcels within an order. Multiple parcels can have the same order
            number if order is shipped in different parcels
          example: ORD12345
        dispatchNumber:
          maxLength: 100
          type: string
          description: "   A number assigned by customer to any grouping of parcels\
            \ from a shipment. This can be leveraged for a variety of purposes:\r\n\
            <br>1. Use dispatchNumber of 0 for any outstanding parcels. Closing the\
            \ dispatch is optional.<br>2. Use customized dispatchNumber. Optionally,\
            \ you can close that dispatchNumber (at the end of the day or whenever\
            \ you want to physically ship) and it will close all the parcels that\
            \ are part of that dispatchNumber. (Please note: that dispatchNumber can\
            \ not be used again)<br>3. Use parcelID as the dispatchNumber. Optionally,\
            \ you can close that dispatchNumber after receiving label and it will\
            \ close out only that package."
          example: PAR202309060001
        parcelId:
          maxLength: 35
          minLength: 4
          type: string
          description: Unique identifier given by customer to each physical parcel.
            This number cannot be reused during the next 12 months. We recommend this
            to be 20 characters or under alphanumeric, no spaces, special characters
            or hyphens.
          example: PAR202309060001
        trackingNumber:
          maxLength: 100
          minLength: 4
          type: string
          description: Applicable when a tracking number range has been pre-assigned
            to a customer. Tracking number allocated to an order parcel will match
            the final label barcode. Not applicable to all destinations/services
          nullable: true
          example: UX000352872CH
        ashid:
          maxLength: 25
          type: string
          description: Asendia Unique Identifier. Applicable when a identifier number
            range has been pre-assigned to a customer. AHSID allocated to an order
            parcel can be used to track the parcel. ASHID is printed on label when
            possible
          nullable: true
          example: ASHK12123456789011
        returnToSender:
          type: boolean
          description: "true = sender address is used by final carrier to return undeliverable\
            \ parcels. Sender address is printed in the FROM area of parcel label\
            \ false = returns address is used instead of sender address for undeliverables.\
            \ Returns address will be printed in the FROM area of parcel label (instead\
            \ of sender address, except if label offers a dedicated area for undeliverables).\
            \ Returns address can be a Asendia Returns centre or a customer warehouse,\
            \ usually in the same country as recipient\r\n<br>Possible Values: true,\
            \ false (default value if null)"
          nullable: true
          example: true
        parcelWeight:
          type: number
          description: The parcel's actual weight Dot ""."" must be used as decimal
            separator
          format: double
          example: 1.2
        weightUnit:
          type: string
          description: "The parcel's unit of weight: Lb or Kg\r\n<br>Possible Values:\
            \ [ Lb, Kg ]"
          example: Kg
        dimLength:
          type: number
          description: The parcel's dimensional length
          format: double
          nullable: true
          example: 25
        dimWidth:
          type: number
          description: The parcel's dimensional width
          format: double
          nullable: true
          example: 15
        dimHeight:
          type: number
          description: The parcel's dimensional height
          format: double
          nullable: true
          example: 10
        dimUnit:
          type: string
          description: "The parcel's dimensional unit: only IN (for Inches) or CM\
            \ (for Centimeters) are allowed\r\n<br>Possible Values: [ IN, CM ]"
          nullable: true
          example: CM
        format:
          type: string
          description: "The parcel's format: B for Boxable, N for Non-boxable, L for\
            \ Large, XL for Extra Large and XXL. Mandatory for e-PAQ Standard, e-PAQ\
            \ Plus using La Poste or Swiss Post labels (format is B or N), and for\
            \ e-PAQ Select Mailbox Plus to Switerland.Can be null for e-PAQ Select\
            \ and e-PAQ Elite except if instructed differently by commercial teams.\r\
            \n<br>Possible Values: null, [B, N, L, XL, XXL]"
          nullable: true
          example: B
        parcelValue:
          type: number
          description: The total value of the parcel
          format: double
          nullable: true
          example: 10
        currencyType:
          type: string
          description: "The currency for all given values related to the package and\
            \ items\r\n<br>Possible Values: [ USD, GBP, EUR, SEK, AUD, HKD, JPY, SGD,\
            \ TWD, DKK, ILS, NZD, NOK, CHF, CAD ] To be amended"
          nullable: true
          example: EUR
        customerReferenceNumber1:
          maxLength: 50
          type: string
          description: A customer reference number that can be used to identify the
            parcel. This can be set up to be used on a per-integration basis.
          nullable: true
          example: Ref1
        customerReferenceNumber2:
          maxLength: 50
          type: string
          description: A second customer reference number that can be used to identify
            the parcel. This can be set up to be used on a per-integration basis.
          nullable: true
          example: Ref2
        customerReferenceNumber3:
          maxLength: 50
          type: string
          description: A third customer reference number that can be used to identify
            the parcel. This can be set up to be used on a per-integration basis.
          nullable: true
          example: Ref3
        reasonForExport:
          type: string
          description: "Category of what is in the parcel. (Most common is M):\r\n\
            <br>D = Document<br>M= Merchandise, Goods<br>G = Gift<br>S = Sample of\
            \ goods<br>R = Returned goods<br>O = Others"
          example: M
        parcelContentDescription:
          maxLength: 150
          type: string
          description: A short description of the category of the parcel's contents.
          nullable: true
          example: 2 watches
        customsPaymentMethod:
          type: string
          description: "This is the payment method for duties and taxes.  Possible\
            \ options are:\r\n<br> RETPAID – Retailer/Seller Paid <br> SHOPAIDORIG\
            \ – Shopper/Buyer/Consumer Paid; held at origin <br> SHOPAIDDEST– Shopper/Buyer/Consumer\
            \ Paid; collected at destination <br> DOMESTIC– Domestic <br> INTRAEU–\
            \ Intra-EU <br> OWNCLEAR – Retailer/Seller manages own clearance <br>\
            \ DDP - Delivered Duty Paid (Incoterm)<br> DAP - Delivery At Place (Incoterm)<br>\
            \ PDDP – PDDP (this incoterm is applicable for La Poste labels) <br> Possible\
            \ Values: [RETPAID,SHOPAIDORIG,SHOPAIDDEST,DOMESTIC,INTRAEU,OWNCLEAR,DDP,DAP,PDDP] "
          nullable: true
        gstCollected:
          type: boolean
          description: 'Possible Values: true, false (default value if null)'
          nullable: true
          example: false
        gstExemptionCode:
          type: string
          description: "When GST has not been charged, an exception code has to be\
            \ provided.\r\nApplicable for instance for Australia destination\r\n<br>\
            \ Ex: AB5 for milk (Australia)"
          nullable: true
          example: AB5
        cpCcode:
          maxLength: 35
          type: string
          description: Code for UK import/export
          nullable: true
          example: 4000C07
        invoiceNumber:
          type: string
          description: Invoice number
          nullable: true
          example: INV202309190001
        invoiceDate:
          type: string
          description: Invoice date YYYY-MM-DD
          format: date-time
          nullable: true
          example: '2023-09-19T00:00:00.0000000'
        discountAmount:
          pattern: ^(0|-?\d{0,10}(\.\d{0,4})?)$
          type: number
          description: Discount amount. To be populated if needed on invoice and/or
            if requested by customs authorities
          format: double
          nullable: true
        pcccCode:
          type: string
          description: 'Code for Korea Post Packages. Format: P followed by 12 digits'
          nullable: true
          example: P123456789012
        asendiaPudoPointID:
          maxLength: 64
          type: string
          description: Asendia PUDO point identifier used to retrieve PUDO address
            details.
          nullable: true
        articles:
          type: array
          items:
            $ref: '#/components/schemas/articlesModel'
          nullable: true
        fees:
          type: array
          items:
            $ref: '#/components/schemas/feesModel'
          nullable: true
      additionalProperties: false
