          description: "The currency for all given values related to the package and\
            \ items\r\n<br>Possible Values: [ USD, GBP, EUR, SEK, AUD, HKD, JPY, SGD,\
            \ TWD, DKK, ILS, NZD, NOK, CHF, CAD ] To be amended"
          nullable: true
