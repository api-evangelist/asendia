          nullable: true
          example: https://www.acme.com/SKU
        composition:
          type: string
          description: 'Example: 100% polyurethane, Cotton, aluminium'
          nullable: true
          example: 100% polyurethane, Cotton, aluminium
        tradeItemNumber:
          type: string
