            <br>D = Document<br>M= Merchandise, Goods<br>G = Gift<br>S = Sample of\
            \ goods<br>R = Returned goods<br>O = Others"
          nullable: true
          example: M
        parcelContentDescription:
          maxLength: 150
          type: string
          description: A short description of the category of the parcel's contents.
          nullable: true
          example: 2 watches
        customsPaymentMethod:
