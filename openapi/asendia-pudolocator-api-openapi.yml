openapi: 3.2.0
info:
  title: Asendia Pudo Locator API
  version: Pudo Locator v2.6
  contact:
    name: Asendia USA Web Service Team for any questions or comments.
    email: john.mcshane@asendia.com;chris.joiner@asendia.com;katie.vogt@asendia.com;ammi.cabrera@asendia.com
  description: 'Operations tagged PudoLocator across 2 of this provider''s published API definitions: asendia-a1-pudo-locator-swagger.json, asendia-a1-pudo-locator-openapi.yml. Each path carries the servers of the definition it was published in.'
tags:
- name: PudoLocator
paths:
  /api/A1/v2.6/PudoLocator/PudoLocation:
    get:
      tags:
      - PudoLocator
      parameters:
      - name: accountNumber
        in: query
        description: Asendia's account number designated for the shipper. This will be provided at account setup.
        required: true
        schema:
          maxLength: 12
          type: string
      - name: subAccountNumber
        in: query
        description: Asendia's sub account number designated for the shipper, if applicable. This will be provided at account setup.
        schema:
          maxLength: 12
          type: string
      - name: processingLocation
        in: query
        description: 'The Asendia''s location in where the physical package will be processed.

          Possible values: SFO, MIA, JFK, PHL, ORD, LAX, SLC, TOR, CAL, BUF'
        required: true
        schema:
          maxLength: 3
          minLength: 3
          type: string
      - name: recipientAddressLine1
        in: query
        description: The first line of the package recipient's street address
        required: true
        schema:
          maxLength: 50
          type: string
      - name: recipientAddressLine2
        in: query
        description: The second line of the package recipient's street address
        schema:
          maxLength: 50
          type: string
      - name: recipientAddressLine3
        in: query
        description: The third line of the package recipient's street address
        schema:
          maxLength: 50
          type: string
      - name: recipientCity
        in: query
        description: The city of the package recipient's street address
        required: true
        schema:
          maxLength: 50
          type: string
      - name: recipientProvince
        in: query
        description: The state or province of the package recipient's street address
        schema:
          maxLength: 50
          type: string
      - name: recipientPostalCode
        in: query
        description: The package recipient's postal code
        required: true
        schema:
          maxLength: 20
          type: string
      - name: recipientCountryCode
        in: query
        description: 'The 2-character ISO country code for the package receipient''s street address.

          See for more information: http://www.iso.org/iso/country_codes'
        required: true
        schema:
          maxLength: 2
          minLength: 2
          type: string
      - name: totalPackageWeight
        in: query
        description: The package's actual weight
        required: true
        schema:
          type: number
          format: double
      - name: weightUnit
        in: query
        description: The package's unit of weight
        required: true
        schema:
          $ref: '#/components/schemas/weightUnitEnum'
      - name: dimLength
        in: query
        description: The packages dimensional length
        schema:
          type: number
          format: double
      - name: dimWidth
        in: query
        description: The packages dimensional width
        schema:
          type: number
          format: double
      - name: dimHeight
        in: query
        description: The packages dimensional height
        schema:
          type: number
          format: double
      - name: dimUnit
        in: query
        description: The packages dimensional unit
        schema:
          $ref: '#/components/schemas/dimUnitEnum'
      - name: productCode
        in: query
        description: 'The Product Codes will be provided on a per-integration basis.

          This indicates the customer’s preferred service or routing for the package.

          (Use * or % for all active.)'
        required: true
        schema:
          maxLength: 5
          type: string
      - name: totalPackageValue
        in: query
        description: The package's value
        schema:
          type: number
          format: double
      - name: currencyType
        in: query
        description: The package's currency type
        schema:
          $ref: '#/components/schemas/currencyTypeEnum'
      - name: radius
        in: query
        description: The radius in kilometers of the search (default is 2)
        schema:
          type: number
          format: double
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PudoLocatorResponseApiResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/PudoLocatorResponseApiResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/PudoLocatorResponseApiResponse'
      summary: Get api a1 pudo locator pudo location
      x-summary-source: derived
      operationId: getApiA1V26PudoLocatorPudoLocation
      x-operation-id-source: derived
