tags:
- name: Consolidation
paths:
  /api/A1/v1.0/Consolidation/Orders:
    post:
      tags:
      - Consolidation
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/ConsolidationOrdersRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/ConsolidationOrdersRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/ConsolidationOrdersRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/ConsolidationOrdersRequest'
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ConsolidationOrdersResponseApiResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ConsolidationOrdersResponseApiResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ConsolidationOrdersResponseApiResponse'
      summary: Create api a1 consolidation orders
      x-summary-source: derived
      operationId: postApiA1V10ConsolidationOrders
      x-operation-id-source: derived
components:
  schemas:
    ConsolidationOrdersResponseApiResponse:
      type: object
      properties:
        data:
          allOf:
          - $ref: '#/components/schemas/ConsolidationOrdersResponse'
        responseStatus:
          allOf:
          - $ref: '#/components/schemas/ResponseStatus'
      additionalProperties: false
    packageIDs:
      required:
      - packageID
      type: object
      properties:
        packageID:
          maxLength: 35
          minLength: 4
          type: string
          description: Unique identifier given to each physical package. This number cannot be reused, and will match the package label's barcode. We recommend this to be 20 characters or under alphanumeric, no spaces, special characters or hyphens.
      additionalProperties: false
    ResponseStatus:
      type: object
      properties:
        responseStatusCode:
          type: integer
          description: This is used to display the code for the return status.
          format: int32
        responseStatusMessage:
          type:
          - string
          - 'null'
          description: This is used for a human readable return status message.
      additionalProperties: false
      description: Displays the status of the Return
    ConsolidationOrdersRequest:
      required:
      - accountNumber
      - orderNumber
      - packageIDs
      - productCode
      type: object
      properties:
        accountNumber:
          maxLength: 12
          type: string
          description: Asendia's account number designated for the shipper. This will be provided at account setup.
        orderNumber:
          maxLength: 35
          type: string
          description: The order identifier number. This is the number representing all packages within an order.
        productCode:
          maxLength: 5
          type: string
          description: 'The Product Codes will be provided on a per-integration basis.

            This indicates the customer’s preferred service or routing for the package.'
        packageIDs:
          type: array
          items:
            $ref: '#/components/schemas/packageIDs'
      additionalProperties: false
    ConsolidationOrdersResponse:
      type: object
      properties:
        messages:
          type:
          - array
          - 'null'
          items:
            type: string
      additionalProperties: false
