    TaxType:
      type: object
      properties:
        taxIdType:
          allOf:
          - $ref: '#/components/schemas/TaxTypeEnum'
          description: The type of tax identifier.
        taxTypeValue:
          type: string
          description: The value associated with the tax type.
          nullable: true
      additionalProperties: false
    postPackageItemRequest:
      required:
      - itemDescription
      - quantity
      - unitPrice
      type: object
      properties:
        sku:
          maxLength: 40
          type: string
          description: 'The item''s SKU number or other searchable product identifier.
            PLEASE NOTE: The SKU max field length is 40 characters but will be truncated
            to 20 characters upon import to Asendia Systems. This means if a SKU is
            22 characters it will import into Asendia systems as 20 characters.'
          nullable: true
        itemDescription:
          maxLength: 150
          type: string
          description: The item description that describes what the item is.
        unitPrice:
          maximum: 10000000000
          minimum: 0.01
          type: number
          description: The retail price for a single unit of the product.
          format: double
        quantity:
          maximum: 1000
          minimum: 0
          type: integer
          description: The total quantity of the product units within the package.
          format: int32
        unitWeight:
          maximum: 1000
          minimum: 0
          type: number
          description: The total weight for a single unit of the product, in pounds.
          format: double
        countryOfOrigin:
          maxLength: 2
          minLength: 2
          type: string
          description: "Please note: If null is passed in, we will default the value\
            \ to US.\r\nThe 2-character ISO country code in which the product was\
            \ manufactured, as required by international customs specifications.\r\
            \nSee for more information: http://www.iso.org/iso/country_codes"
          nullable: true
        htsNumber:
          maxLength: 20
          type: string
          description: " The Harmonized Tariff Schedule code required by international\
            \ customs specifications.\r\nSee for more information: http://www.usitc.gov/tata/hts/index.htm"
          nullable: true
        disclaim:
          maxLength: 1
          type: string
          description: "Indicates that the package item requires CPSC information.\r\
            \nValid values: Y or empty string. Required when htsNumber is on the CPSC\
            \ HTS list; omit the field to skip CPSC checks for the item."
          nullable: true
        disclaimReason:
          maxLength: 20
          type: string
          description: Indicates why CPSC information is required. Mandatory when
            disclaim = Y.
          nullable: true
        intendedUseCode:
          maxLength: 20
          type: string
          description: Description category code providing additional information
            about the item. Mandatory when disclaim = Y.
          nullable: true
        intendedUseDescription:
          maxLength: 900
          type: string
          description: Additional information used to describe the item. Mandatory
            when intendedUseCode = 980.000.
          nullable: true
        productUrl:
          maxLength: 2000
          type: string
          description: "Public URL to product information.\r\nConditionally required\
            \ based on end carrier for clearance purposes.  If required, must begin\
            \ with \"https://\" (case-insensitive)."
          nullable: true
      additionalProperties: false
    pudoAddress:
      type: object
      properties:
        address1:
          type: string
          nullable: true
        address2:
          type: string
          nullable: true
        address3:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        state:
          type: string
          nullable: true
        zipCode:
          type: string
          nullable: true
        countryCode:
          type: string
          nullable: true
        pudoId:
          maxLength: 20
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        suburb:
          type: string
          nullable: true
        streetNumber:
          type: string
          nullable: true
        latitude:
          type: number
          format: double
          nullable: true
        longitude:
          type: number
          format: double
          nullable: true
        radius:
          type: number
          format: double
          nullable: true
        type:
          type: string
          nullable: true
      additionalProperties: false
    postPackageBulkRequest:
      required:
      - accountNumber
      - contentType
      - currencyType
      - dispatchNumber
      - items
      - labelType
      - orderNumber
      - packageID
      - processingLocation
      - productCode
      - recipientAddressLine1
      - recipientCity
      - recipientCountryCode
      - recipientFirstName
      - recipientLastName
      - recipientPostalCode
      - returnAddressLine1
      - returnCity
      - returnCountryCode
      - returnFirstName
      - returnLastName
      - returnPostalCode
      - returnProvince
      - totalPackageValue
      - totalPackageWeight
      - weightUnit
      type: object
      properties:
        processingLocation:
          maxLength: 5
          minLength: 3
          type: string
          description: "The Asendia's location in where the physical package will\
            \ be processed.\r\nPossible values: MIA, JFK, PHL, ORD, LAX, SLC, TOR,\
            \ CAL, BUF, YVR, LRD, YYZ, UK"
        additionalShippingCode:
          type: string
          nullable: true
        accountNumber:
          maxLength: 12
          type: string
          description: Asendia's account number designated for the shipper. This will
            be provided at account setup.
        subAccountNumber:
          maxLength: 12
          type: string
          description: Asendia's sub account number designated for the shipper, if
            applicable. This will be provided at account setup.
          nullable: true
        includeRate:
          type: boolean
          description: Signifies whether or not to send back the Rate for this package.  If
            failLabelIfNoRate is also set to true, the label call will fail if no
            rates are found for the package data.
        failLabelIfNoRate:
          type: boolean
          description: Signifies whether the label call should fail if no rates are
            found for the package.  This variable is only considered when includeRate
            is set to true.
        labelType:
          allOf:
          - $ref: '#/components/schemas/labelTypeEnum'
          description: "This is the preferred format for the returned label.\r\nThere\
            \ might be times that the preferred type is not available, in which case\
            \ it will return the type that is available,\r\nand the return type will\
            \ describe the type that it is."
        orderNumber:
          maxLength: 35
          type: string
          description: The order identifier number. This is the number representing
            all packages within an order.
        dispatchNumber:
          maxLength: 100
          type: string
          description: "A number assigned to any grouping of packages from a shipment.\
            \ This can be leveraged for a variety of purposes:\r\n1. Use dispatchNumber\
            \ of 0 for any outstanding packages. Closing the dispatch is optional.\r\
            \n2. Use customized dispatchNumber. Optionally, you can close that dispatchNumber\
            \ (at the end of the day or whenever you want to physically ship) and\
            \ it will close all the packages that are part of that dispatchNumber.\
            \ (Please note: that dispatchNumber can not be used again)\r\n3. Use packageid\
            \ as the dispatchNumber. Optionally, you can close that dispatchNumber\
            \ after receiving label and it will close out only that package."
        packageID:
          maxLength: 35
          minLength: 4
          type: string
          description: Unique identifier given to each physical package. This number
            cannot be reused, and will match the package label's barcode. We recommend
            this to be 20 characters or under alphanumeric, no spaces, special characters
            or hyphens.
        recipientTaxID:
          maxLength: 25
          type: string
          description: ''
          nullable: true
        returnFirstName:
          maxLength: 50
          type: string
          description: The package sender's first name
        returnLastName:
          maxLength: 50
          type: string
          description: The package sender's last name
        returnCompanyName:
          maxLength: 50
          type: string
          description: The package sender's company name
          nullable: true
        returnAddressLine1:
          maxLength: 50
          type: string
          description: The first line of the sender's street address
        returnAddressLine2:
          maxLength: 50
          type: string
          description: The second line of the sender's street address
          nullable: true
        returnAddressLine3:
          maxLength: 50
          type: string
          description: The third line of the sender's street address
          nullable: true
        returnCity:
          maxLength: 50
          type: string
          description: The city of the sender's street address
        returnProvince:
          maxLength: 50
          type: string
          description: The state of province of the sender's street address
        returnPostalCode:
          maxLength: 20
          type: string
          description: The sender's postal code
        returnCountryCode:
          maxLength: 2
          minLength: 2
          type: string
          description: "The 2-character ISO country code for the sender's street address.\r\
            \nSee for more information: http://www.iso.org/iso/country_codes"
        returnPhone:
          maxLength: 25
          type: string
          description: The sender's phone number
          format: tel
          nullable: true
        returnEmail:
          maxLength: 50
          type: string
          description: The sender's email address
          format: email
          nullable: true
        recipientFirstName:
          maxLength: 50
          type: string
          description: The package recipient's first name
        recipientLastName:
          maxLength: 50
          type: string
          description: The package recipient's last name
        recipientBusinessName:
          maxLength: 50
          type: string
          description: The package recipient's business name
          nullable: true
        recipientAddressLine1:
          maxLength: 50
          type: string
          description: The first line of the package recipient's street address
        recipientAddressLine2:
          maxLength: 50
          type: string
          description: The second line of the package recipient's street address
          nullable: true
        recipientAddressLine3:
          maxLength: 50
          type: string
          description: The third line of the package recipient's street address
          nullable: true
        recipientCity:
          maxLength: 50
          type: string
          description: The city of the package recipient's street address
        recipientProvince:
          maxLength: 50
          type: string
          description: The state or province of the package recipient's street address
          nullable: true
        recipientPostalCode:
          maxLength: 20
          type: string
          description: The package recipient's postal code
        recipientCountryCode:
          maxLength: 2
          minLength: 2
          type: string
          description: "The 2-character ISO country code for the package receipient's\
            \ street address.\r\nSee for more information: http://www.iso.org/iso/country_codes"
        recipientPhone:
          maxLength: 25
          type: string
          description: The package recipient's phone number
          format: tel
          nullable: true
        recipientEmail:
          maxLength: 75
          type: string
          description: The package recipient's email address
          format: email
          nullable: true
        totalPackageWeight:
          minimum: 0
          type: number
          description: The package's actual weight
          format: double
        weightUnit:
          allOf:
          - $ref: '#/components/schemas/weightUnitEnum'
          description: The package's unit of weight
        dimLength:
          type: number
          description: The packages dimensional length
          format: double
        dimWidth:
          type: number
          description: The packages dimensional width
          format: double
        dimHeight:
          type: number
          description: The packages dimensional height
          format: double
        dimUnit:
          allOf:
          - $ref: '#/components/schemas/dimUnitEnum'
          description: "The packages dimensional unit\r\n<br>Possible Values: IN,\
            \ CM (default is IN)"
        totalPackageValue:
          type: number
          description: The total value of the package
          format: double
        currencyType:
          allOf:
          - $ref: '#/components/schemas/currencyTypeEnum'
          description: The currency for all given values related to the package and
            items. This is required to be USD.
        productCode:
          maxLength: 25
          type: string
          description: "The Product Codes will be provided on a per-integration basis.\r\
            \nThis indicates the customer's preferred service or routing for the package."
        customerReferenceNumber1:
          maxLength: 50
          type: string
          description: A customer reference number that can be used to identify the
            package. This can be set up to be used on a per-integration basis.
          nullable: true
        customerReferenceNumber2:
          maxLength: 50
          type: string
          description: A second customer reference number that can be used to identify
            the package. This can be set up to be used on a per-integration basis.
          nullable: true
        customerReferenceNumber3:
          maxLength: 50
          type: string
          description: A third customer reference number that can be used to identify
            the package. This can be set up to be used on a per-integration basis.
          nullable: true
        contentType:
          allOf:
          - $ref: '#/components/schemas/contentTypeEnum'
          description: "Category of what is in the package. (Most common is M):\r\n\
            1. M = Merchandise\r\n2. G = Gift\r\n3. D = Document"
        packageContentDescription:
          maxLength: 150
          type: string
          description: A short description of the category of the package's contents.
          nullable: true
        vatNumber:
          maxLength: 20
          type: string
          description: VAT Number - This field can be used for VAT Number or IOSS
            Number whichever applies to the destination country for this package.
          nullable: true
        sellerName:
          maxLength: 50
          type: string
          description: The package seller's name
          nullable: true
        sellerAddressLine1:
          maxLength: 50
          type: string
          description: The first line of the seller's street address
          nullable: true
        sellerAddressLine2:
          maxLength: 50
          type: string
          description: The second line of the seller's street address
          nullable: true
        sellerAddressLine3:
          maxLength: 50
          type: string
          description: The third line of the seller's street address
          nullable: true
        sellerCity:
          maxLength: 50
          type: string
          description: The city of the seller's street address
          nullable: true
        sellerProvince:
          maxLength: 50
          type: string
          description: The state of province of the seller's street address
          nullable: true
        sellerPostalCode:
          maxLength: 20
          type: string
          description: The seller's postal code
          nullable: true
        sellerCountryCode:
          maxLength: 2
          minLength: 2
          type: string
          description: "The 2-character ISO country code for the seller's street address.\r\
            \nSee for more information: http://www.iso.org/iso/country_codes"
          nullable: true
        sellerPhone:
          maxLength: 25
          type: string
          description: The seller's phone number
          format: tel
          nullable: true
        sellerEmail:
          maxLength: 50
          type: string
          description: The seller's email address
          format: email
          nullable: true
        taxes:
          type: array
          items:
            $ref: '#/components/schemas/TaxType'
          description: "List of tax types and their values for the package. Each tax\
            \ type contains a tax identifier type and its corresponding value.\r\n\
            1. stateTaxBrl = Recipient State Tax ID (part of the Remessa Conforme\
            \ program).\r\n2. federalTaxBrl = Recipient Federal Tax ID (part of the\
            \ Remessa Conforme program)."
          nullable: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/postPackageItemRequest'
          description: An item level information about each of the individual items
            inside the package
        shippingCost:
          type: number
          description: The shipping cost of the package
          format: double
        pudoAddress:
          allOf:
          - $ref: '#/components/schemas/pudoAddress'
          nullable: true
        checkServiceDims:
          type: boolean
          description: "Optional flag to enable service dimension validation when\
            \ routing lookup is performed.\r\nOnly applies when includeRate is true\
            \ and productCode is not \"*\" or \"%\"."
        format:
          type: string
          nullable: true
        customerInvoice:
          type: string
          description: "Optional base64-encoded commercial invoice PDF. When provided,\
            \ stored on the package\r\nand forwarded to A-CL getLabel as carrierServiceParameters.customerInvoice."
          nullable: true
      additionalProperties: false
    shippingRate:
      type: object
      properties:
        productCode:
          type: string
          description: Service Type codes will be provided on a per-integration basis.
            This indicates the customer’s preferred service or routing for the package.
          nullable: true
        rate:
          type: number
          description: Total rate for this package in USD.
          format: double
        currencyType:
          type: string
          description: The currency for all given values related to the package and
            items. This is required to be USD.
          nullable: true
        quoteCode:
          type: string
          nullable: true
        systemMessage:
          type: string
          nullable: true
      additionalProperties: false
    label:
      type: object
      properties:
        name:
          type: string
          nullable: true
        type:
          type: string
          nullable: true
        content:
          type: string
          nullable: true
      additionalProperties: false
    packageLabel:
      type: object
      properties:
        packageId:
          type: string
          nullable: true
        trackingNumber:
          type: string
          nullable: true
        labels:
          type: array
          items:
            $ref: '#/components/schemas/label'
          nullable: true
      additionalProperties: false
    responseStatus:
      type: object
      properties:
        responseStatusCode:
          type: integer
          description: This is used to display the code for the return status.
          format: int32
        responseStatusMessage:
          type: string
          description: This is used for a human readable return status message.
          nullable: true
      additionalProperties: false
      description: Displays the status of the Return
    HttpStatusCode:
      enum:
      - Continue
      - SwitchingProtocols
      - Processing
      - EarlyHints
      - OK
      - Created
      - Accepted
      - NonAuthoritativeInformation
      - NoContent
      - ResetContent
      - PartialContent
      - MultiStatus
      - AlreadyReported
      - IMUsed
      - MultipleChoices
      - Ambiguous
      - MovedPermanently
      - Moved
      - Found
      - Redirect
      - SeeOther
      - RedirectMethod
      - NotModified
      - UseProxy
      - Unused
      - TemporaryRedirect
      - RedirectKeepVerb
      - PermanentRedirect
      - BadRequest
      - Unauthorized
      - PaymentRequired
      - Forbidden
      - NotFound
      - MethodNotAllowed
      - NotAcceptable
      - ProxyAuthenticationRequired
      - RequestTimeout
      - Conflict
      - Gone
      - LengthRequired
      - PreconditionFailed
      - RequestEntityTooLarge
      - RequestUriTooLong
      - UnsupportedMediaType
      - RequestedRangeNotSatisfiable
      - ExpectationFailed
      - MisdirectedRequest
      - UnprocessableEntity
      - Locked
      - FailedDependency
      - UpgradeRequired
      - PreconditionRequired
      - TooManyRequests
      - RequestHeaderFieldsTooLarge
      - UnavailableForLegalReasons
      - InternalServerError
      - NotImplemented
      - BadGateway
      - ServiceUnavailable
      - GatewayTimeout
      - HttpVersionNotSupported
      - VariantAlsoNegotiates
      - InsufficientStorage
      - LoopDetected
      - NotExtended
      - NetworkAuthenticationRequired
      type: string
    ResponseStatus:
      type: object
      properties:
        responseStatusCode:
          allOf:
          - $ref: '#/components/schemas/HttpStatusCode'
        responseStatusMessage:
          type: string
          nullable: true
      additionalProperties: false
    postPackageResponse:
      type: object
      properties:
        shippingRates:
          type: array
          items:
            $ref: '#/components/schemas/shippingRate'
          description: Shipping rate property will only appear if "includeRate" is
            set to true in the request.
          nullable: true
        packageLabel:
          allOf:
          - $ref: '#/components/schemas/packageLabel'
          nullable: true
        responseStatus:
          allOf:
          - $ref: '#/components/schemas/ResponseStatus'
          nullable: true
      additionalProperties: false
