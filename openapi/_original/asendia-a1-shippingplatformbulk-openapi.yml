# x-archived-from: asendia-a1-shippingplatformbulk-openapi.yml
# x-archived-on: 2026-10-16
openapi: 3.0.1
info:
  title: A1 Web Services
  description: These are all the APIs needed to handle ShippingPlatformBulk v1.0
  contact:
    name: Asendia USA Web Service Team for any questions or comments.
    email: john.mcshane@asendia.com;chris.joiner@asendia.com;katie.vogt@asendia.com;ammi.cabrera@asendia.com
  version: ShippingPlatformBulk v1.0
paths:
  /api/A1/v1.0/ShippingPlatformBulk/Package:
    post:
      tags:
      - ShippingPlatformBulk
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/postPackageBulkRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/postPackageBulkRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/postPackageBulkRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/postPackageBulkRequest'
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/postPackageResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/postPackageResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/postPackageResponse'
