          description: 'The item''s SKU number or other searchable product identifier. PLEASE NOTE: The SKU max field length is 40 characters but will be truncated to 20 characters upon import to Asendia Systems. This means if a SKU is 22 characters it will import into Asendia systems as 20 characters.'
        itemDescription:
          maxLength: 150
          type: string
          description: The item description that describes what the item is.
        unitPrice:
          maximum: 10000000000
          minimum: 0.01
          type: number
          description: The retail price for a single unit of the product.
          format: double
        quantity:
          maximum: 1000
          minimum: 0
          type: integer
          description: The total quantity of the product units within the package.
          format: int32
        unitWeight:
          maximum: 1000
          minimum: 0
          type: number
          description: The total weight for a single unit of the product, in pounds.
          format: double
        countryOfOrigin:
          maxLength: 2
          minLength: 2
          type:
          - string
          - 'null'
          description: 'Please note: If null is passed in, we will default the value to US.

            The 2-character ISO country code in which the product was manufactured, as required by international customs specifications.

            See for more information: http://www.iso.org/iso/country_codes'
        htsNumber:
          maxLength: 20
          type:
          - string
          - 'null'
          description: ' The Harmonized Tariff Schedule code required by international customs specifications.

            See for more information: http://www.usitc.gov/tata/hts/index.htm'
        disclaim:
          maxLength: 1
          type:
          - string
          - 'null'
          description: 'Indicates that the package item requires CPSC information.

            Valid values: Y or empty string. Required when htsNumber is on the CPSC HTS list; omit the field to skip CPSC checks for the item.'
        disclaimReason:
          maxLength: 20
          type:
          - string
          - 'null'
          description: Indicates why CPSC information is required. Mandatory when disclaim = Y.
        intendedUseCode:
          maxLength: 20
          type:
          - string
          - 'null'
          description: Description category code providing additional information about the item. Mandatory when disclaim = Y.
        intendedUseDescription:
          maxLength: 900
          type:
          - string
          - 'null'
          description: Additional information used to describe the item. Mandatory when intendedUseCode = 980.000.
        productUrl:
