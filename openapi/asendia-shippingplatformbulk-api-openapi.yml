          minLength: 3
          type: string
          description: 'The Asendia''s location in where the physical package will be processed.

            Possible values: MIA, JFK, PHL, ORD, LAX, SLC, TOR, CAL, BUF, YVR, LRD, YYZ, UK'
        additionalShippingCode:
          type:
          - string
          - 'null'
        accountNumber:
          maxLength: 12
          type: string
          description: Asendia's account number designated for the shipper. This will be provided at account setup.
        subAccountNumber:
          maxLength: 12
          type:
          - string
          - 'null'
          description: Asendia's sub account number designated for the shipper, if applicable. This will be provided at account setup.
        includeRate:
          type: boolean
          description: Signifies whether or not to send back the Rate for this package.  If failLabelIfNoRate is also set to true, the label call will fail if no rates are found for the package data.
        failLabelIfNoRate:
          type: boolean
          description: Signifies whether the label call should fail if no rates are found for the package.  This variable is only considered when includeRate is set to true.
        labelType:
          allOf:
          - $ref: '#/components/schemas/labelTypeEnum'
          description: 'This is the preferred format for the returned label.

            There might be times that the preferred type is not available, in which case it will return the type that is available,

            and the return type will describe the type that it is.'
        orderNumber:
          maxLength: 35
          type: string
          description: The order identifier number. This is the number representing all packages within an order.
        dispatchNumber:
          maxLength: 100
          type: string
          description: 'A number assigned to any grouping of packages from a shipment. This can be leveraged for a variety of purposes:

            1. Use dispatchNumber of 0 for any outstanding packages. Closing the dispatch is optional.

            2. Use customized dispatchNumber. Optionally, you can close that dispatchNumber (at the end of the day or whenever you want to physically ship) and it will close all the packages that are part of that dispatchNumber. (Please note: that dispatchNumber can not be used again)

            3. Use packageid as the dispatchNumber. Optionally, you can close that dispatchNumber after receiving label and it will close out only that package.'
        packageID:
          maxLength: 35
          minLength: 4
          type: string
          description: Unique identifier given to each physical package. This number cannot be reused, and will match the package label's barcode. We recommend this to be 20 characters or under alphanumeric, no spaces, special characters or hyphens.
