  title: Asendia Shipping Platform Bulk API
  version: ShippingPlatformBulk v1.0
  contact:
    name: Asendia USA Web Service Team for any questions or comments.
    email: john.mcshane@asendia.com;chris.joiner@asendia.com;katie.vogt@asendia.com;ammi.cabrera@asendia.com
  description: 'Operations tagged ShippingPlatformBulk across 2 of this provider''s published API definitions: asendia-a1-shippingplatformbulk-swagger.json, asendia-a1-shippingplatformbulk-openapi.yml. Each path carries the servers of the definition it was published in.'
tags:
- name: ShippingPlatformBulk
paths:
  /api/A1/v1.0/ShippingPlatformBulk/Package:
    post:
      tags:
      - ShippingPlatformBulk
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/postPackageBulkRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/postPackageBulkRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/postPackageBulkRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/postPackageBulkRequest'
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/postPackageResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/postPackageResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/postPackageResponse'
      summary: Create api a1 shipping platform bulk package
      x-summary-source: derived
      operationId: postApiA1V10ShippingPlatformBulkPackage
      x-operation-id-source: derived
