    parcelModel:
      required:
      - dispatchNumber
      - orderNumber
      - parcelId
      - parcelWeight
      - reasonForExport
      - weightUnit
      type: object
      properties:
        orderNumber:
          maxLength: 35
          type: string
          description: The order identifier number. This is the number representing all parcels within an order. Multiple parcels can have the same order number if order is shipped in different parcels
          example: ORD12345
        dispatchNumber:
          maxLength: 100
          type: string
          description: '   A number assigned by customer to any grouping of parcels from a shipment. This can be leveraged for a variety of purposes:

            <br>1. Use dispatchNumber of 0 for any outstanding parcels. Closing the dispatch is optional.<br>2. Use customized dispatchNumber. Optionally, you can close that dispatchNumber (at the end of the day or whenever you want to physically ship) and it will close all the parcels that are part of that dispatchNumber. (Please note: that dispatchNumber can not be used again)<br>3. Use parcelID as the dispatchNumber. Optionally, you can close that dispatchNumber after receiving label and it will close out only that package.'
          example: PAR202309060001
        parcelId:
          maxLength: 35
          minLength: 4
          type: string
          description: Unique identifier given by customer to each physical parcel. This number cannot be reused during the next 12 months. We recommend this to be 20 characters or under alphanumeric, no spaces, special characters or hyphens.
          example: PAR202309060001
        trackingNumber:
          maxLength: 100
          minLength: 4
          type:
          - string
          - 'null'
          description: Applicable when a tracking number range has been pre-assigned to a customer. Tracking number allocated to an order parcel will match the final label barcode. Not applicable to all destinations/services
          example: UX000352872CH
        ashid:
          maxLength: 25
          type:
          - string
          - 'null'
          description: Asendia Unique Identifier. Applicable when a identifier number range has been pre-assigned to a customer. AHSID allocated to an order parcel can be used to track the parcel. ASHID is printed on label when possible
          example: ASHK12123456789011
        returnToSender:
          type:
          - boolean
          - 'null'
          description: 'true = sender address is used by final carrier to return undeliverable parcels. Sender address is printed in the FROM area of parcel label false = returns address is used instead of sender address for undeliverables. Returns address will be printed in the FROM area of parcel label (instead of sender address, except if label offers a dedicated area for undeliverables). Returns address can be a Asendia Returns centre or a customer warehouse, usually in the same country as recipient

            <br>Possible Values: true, false (default value if null)'
          example: true
        parcelWeight:
          type: number
          description: The parcel's actual weight Dot ""."" must be used as decimal separator
          format: double
          example: 1.2
        weightUnit:
          type: string
          description: 'The parcel''s unit of weight: Lb or Kg

            <br>Possible Values: [ Lb, Kg ]'
          example: Kg
        dimLength:
          type:
          - number
          - 'null'
          description: The parcel's dimensional length
          format: double
          example: 25
        dimWidth:
          type:
          - number
          - 'null'
          description: The parcel's dimensional width
          format: double
          example: 15
        dimHeight:
          type:
          - number
          - 'null'
          description: The parcel's dimensional height
          format: double
          example: 10
        dimUnit:
          type:
          - string
          - 'null'
          description: 'The parcel''s dimensional unit: only IN (for Inches) or CM (for Centimeters) are allowed

            <br>Possible Values: [ IN, CM ]'
          example: CM
        format:
          type:
          - string
          - 'null'
          description: 'The parcel''s format: B for Boxable, N for Non-boxable, L for Large, XL for Extra Large and XXL. Mandatory for e-PAQ Standard, e-PAQ Plus using La Poste or Swiss Post labels (format is B or N), and for e-PAQ Select Mailbox Plus to Switerland.Can be null for e-PAQ Select and e-PAQ Elite except if instructed differently by commercial teams.

            <br>Possible Values: null, [B, N, L, XL, XXL]'
          example: B
        parcelValue:
          type:
          - number
          - 'null'
          description: The total value of the parcel
          format: double
          example: 10
        currencyType:
          type:
          - string
          - 'null'
          description: 'The currency for all given values related to the package and items

            <br>Possible Values: [ USD, GBP, EUR, SEK, AUD, HKD, JPY, SGD, TWD, DKK, ILS, NZD, NOK, CHF, CAD ] To be amended'
          example: EUR
        customerReferenceNumber1:
          maxLength: 50
          type:
          - string
          - 'null'
          description: A customer reference number that can be used to identify the parcel. This can be set up to be used on a per-integration basis.
          example: Ref1
        customerReferenceNumber2:
          maxLength: 50
          type:
          - string
          - 'null'
          description: A second customer reference number that can be used to identify the parcel. This can be set up to be used on a per-integration basis.
          example: Ref2
        customerReferenceNumber3:
          maxLength: 50
          type:
          - string
          - 'null'
          description: A third customer reference number that can be used to identify the parcel. This can be set up to be used on a per-integration basis.
          example: Ref3
        reasonForExport:
          type: string
          description: 'Category of what is in the parcel. (Most common is M):

            <br>D = Document<br>M= Merchandise, Goods<br>G = Gift<br>S = Sample of goods<br>R = Returned goods<br>O = Others'
          example: M
        parcelContentDescription:
          maxLength: 150
          type:
          - string
          - 'null'
          description: A short description of the category of the parcel's contents.
          example: 2 watches
        customsPaymentMethod:
          type:
          - string
          - 'null'
          description: 'This is the payment method for duties and taxes.  Possible options are:

            <br> RETPAID – Retailer/Seller Paid <br> SHOPAIDORIG – Shopper/Buyer/Consumer Paid; held at origin <br> SHOPAIDDEST– Shopper/Buyer/Consumer Paid; collected at destination <br> DOMESTIC– Domestic <br> INTRAEU– Intra-EU <br> OWNCLEAR – Retailer/Seller manages own clearance <br> DDP - Delivered Duty Paid (Incoterm)<br> DAP - Delivery At Place (Incoterm)<br> PDDP – PDDP (this incoterm is applicable for La Poste labels) <br> Possible Values: [RETPAID,SHOPAIDORIG,SHOPAIDDEST,DOMESTIC,INTRAEU,OWNCLEAR,DDP,DAP,PDDP] '
        gstCollected:
          type:
          - boolean
          - 'null'
          description: 'Possible Values: true, false (default value if null)'
          example: false
        gstExemptionCode:
          type:
          - string
          - 'null'
          description: 'When GST has not been charged, an exception code has to be provided.

