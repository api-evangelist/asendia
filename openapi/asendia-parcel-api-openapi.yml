openapi: 3.2.0
info:
  title: Asendia Parcel API
  version: Parcel v1.0
  contact:
    name: Asendia USA Web Service Team for any questions or comments.
    email: john.mcshane@asendia.com;chris.joiner@asendia.com;katie.vogt@asendia.com;ammi.cabrera@asendia.com
  description: 'Operations tagged Parcel across 2 of this provider''s published API definitions: asendia-a1-parcel-swagger.json, asendia-a1-parcel-openapi.yml. Each path carries the servers of the definition it was published in.'
tags:
- name: Parcel
paths:
  /api/A1/v1.0/Parcel/CreateParcel:
    post:
      tags:
      - Parcel
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/postParcelRequestModel'
          application/json:
            schema:
              $ref: '#/components/schemas/postParcelRequestModel'
          text/json:
            schema:
              $ref: '#/components/schemas/postParcelRequestModel'
          application/*+json:
            schema:
              $ref: '#/components/schemas/postParcelRequestModel'
      responses:
        '204':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/postParcelResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/postParcelResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/postParcelResponse'
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/postParcelResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/postParcelResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/postParcelResponse'
      summary: Create api a1 parcel create parcel
      x-summary-source: derived
      operationId: postApiA1V10ParcelCreateParcel
      x-operation-id-source: derived
  /api/A1/v1.0/Parcel/CustomerCreateParcel:
    post:
      tags:
      - Parcel
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/postCustomerParcelRequestModel'
          application/json:
            schema:
              $ref: '#/components/schemas/postCustomerParcelRequestModel'
          text/json:
            schema:
              $ref: '#/components/schemas/postCustomerParcelRequestModel'
          application/*+json:
            schema:
              $ref: '#/components/schemas/postCustomerParcelRequestModel'
      responses:
        '204':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/postParcelResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/postParcelResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/postParcelResponse'
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/postParcelResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/postParcelResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/postParcelResponse'
      summary: Create api a1 parcel customer create parcel
      x-summary-source: derived
      operationId: postApiA1V10ParcelCustomerCreateParcel
      x-operation-id-source: derived
  /api/A1/v1.0/Parcel/UKCreateParcel:
    post:
      tags:
      - Parcel
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/postUKParcelRequestModel'
          application/json:
            schema:
              $ref: '#/components/schemas/postUKParcelRequestModel'
          text/json:
            schema:
              $ref: '#/components/schemas/postUKParcelRequestModel'
          application/*+json:
            schema:
              $ref: '#/components/schemas/postUKParcelRequestModel'
      responses:
        '200':
          description: Success
      summary: Create api a1 parcel uk create parcel
      x-summary-source: derived
      operationId: postApiA1V10ParcelUKCreateParcel
      x-operation-id-source: derived
    put:
      tags:
      - Parcel
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/postUKParcelRequestModel'
          application/json:
            schema:
              $ref: '#/components/schemas/postUKParcelRequestModel'
          text/json:
            schema:
              $ref: '#/components/schemas/postUKParcelRequestModel'
          application/*+json:
            schema:
              $ref: '#/components/schemas/postUKParcelRequestModel'
      responses:
        '200':
          description: Success
      summary: Replace api a1 parcel uk create parcel
      x-summary-source: derived
      operationId: putApiA1V10ParcelUKCreateParcel
      x-operation-id-source: derived
  /api/A1/v1.0/Parcel/DeleteParcel:
    put:
      tags:
      - Parcel
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/deleteParcelRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/deleteParcelRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/deleteParcelRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/deleteParcelRequest'
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/responseStatus'
            application/json:
              schema:
                $ref: '#/components/schemas/responseStatus'
            text/json:
              schema:
                $ref: '#/components/schemas/responseStatus'
      summary: Replace api a1 parcel delete parcel
      x-summary-source: derived
      operationId: putApiA1V10ParcelDeleteParcel
      x-operation-id-source: derived
components:
  schemas:
    deleteParcelRequest:
      required:
      - accountNumber
      type: object
      properties:
        accountNumber:
          maxLength: 12
          type: string
        subAccountNumber:
          maxLength: 12
          type:
          - string
          - 'null'
        parcel:
          allOf:
          - $ref: '#/components/schemas/parcel'
      additionalProperties: false
    ukRecipientModel:
      required:
      - recipientCountryCode
      type: object
      properties:
        recipientFirstName:
          maxLength: 50
          type:
          - string
          - 'null'
          description: The parcel recipient's first name
        recipientLastName:
          maxLength: 50
          type:
          - string
          - 'null'
          description: The parcel recipient's last name
        recipientBusinessName:
          maxLength: 50
          type:
          - string
          - 'null'
          description: The parcel recipient's business name
        recipientAddressLine1:
          maxLength: 50
          type:
          - string
          - 'null'
          description: The first line of the parcel recipient's street address
        recipientAddressLine2:
          maxLength: 50
          type:
          - string
          - 'null'
          description: The second line of the parcel recipient's street address
        recipientAddressLine3:
          maxLength: 50
          type:
          - string
          - 'null'
          description: The third line of the parcel recipient's street address
        recipientHouseNumber:
          maxLength: 10
          type:
          - string
          - 'null'
          description: The parcel recipient's house number
        recipientCity:
          maxLength: 50
          type:
          - string
          - 'null'
          description: The city of the package recipient's street address
        recipientProvince:
          maxLength: 50
          type:
          - string
          - 'null'
          description: The state or province of the package recipient's street address
        recipientPostalCode:
          maxLength: 50
          type:
          - string
          - 'null'
          description: The parcel recipient's postal code
        recipientCountryCode:
          maxLength: 2
          minLength: 2
          type: string
          description: 'The 2-character ISO country code for the parcel recipient''s street address. See for more information: http://www.iso.org/iso/country_codes'
        recipientEmail:
          maxLength: 75
          type:
          - string
          - 'null'
          description: The parcel recipient's email address
          format: email
        recipientPhoneNumber:
          maxLength: 25
          type:
          - string
          - 'null'
          description: The parcel recipient's phone number
        recipientMobileNumber:
          maxLength: 25
          type:
          - string
          - 'null'
          description: The parcel recipient's mobile phone number
        recipientIdentificationNumber:
          type:
          - string
          - 'null'
          description: The parcel recipient's identification number. Type is provided in recipientIdentificationType
        recipientIdentificationType:
          type:
          - string
          - 'null'
          description: 'Recipient ID type (number must be provided in field recipientIdentificationNumber) :

            <br> PASSP - Passport <br> IDCARD - National Identity Card <br> DRIVL - Driver License <br> CHUID - Swiss UID <br> ABN - ABN (Australian Business Number) '
        recipientTaxID:
          type:
          - string
          - 'null'
          description: "Recipient Tax/VAT number in the destination country.\n <br> Ch VAT (VAT number in Switzerland) <br> CPF (individual tax id in Brazil) <br> CNPJ (business tax ID in Brazil) "
        recipientEORI:
          maxLength: 15
          type:
          - string
          - 'null'
          description: Recipient's EORI number (when recipient is a company)
        recipientAEO:
          type:
          - string
          - 'null'
          description: The recipient's AEO (Authorised Economic Operator) number (when recipient is a company)
        recipientLatitude:
          pattern: ^(0|-?\d{0,9}(\.\d{0,6})?)$
          type:
          - number
          - 'null'
          description: Latitude coordinates of the delivery address
          format: double
        recipientLongitude:
          pattern: ^(0|-?\d{0,9}(\.\d{0,6})?)$
          type:
          - number
          - 'null'
          description: Longitude coordinates of the delivery address
          format: double
        recipientPudoId:
          type:
          - string
          - 'null'
          description: PUDO Identifier for parcels delivered to a PickUp/DropOff point
        w3w:
          pattern: ^(?i:[a-z]{1,16}(?:\.[a-z]{1,16}){2})$
          type:
          - string
          - 'null'
          description: What 3 Words
      additionalProperties: false
    postParcelResponse:
      type: object
      properties:
        shippingRates:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/shippingRate'
        parcelLabels:
          allOf:
          - $ref: '#/components/schemas/parcelPackageLabel'
        responseStatus:
          allOf:
          - $ref: '#/components/schemas/responseStatus'
        parcelStatus:
          type:
          - string
          - 'null'
        parcelCode:
          type:
          - string
          - 'null'
        parcelInbound:
          type:
          - string
          - 'null'
        parcelOutbound:
          type:
          - string
          - 'null'
        parcelRouteCode:
          type:
          - string
          - 'null'
        accountNumber:
          type:
          - string
          - 'null'
      additionalProperties: false
    articlesModel:
      type: object
      properties:
        sku:
          maxLength: 40
          type:
          - string
          - 'null'
          description: 'The item''s SKU number or other searchable product identifier. PLEASE NOTE: The SKU max field length is 40 characters but will be truncated to 20 characters upon import to Asendia Systems. This means if a SKU is 22 characters it will import into Asendia systems as 20 characters.'
          example: BLUW12345678
        articleDescription:
          maxLength: 150
          type:
          - string
          - 'null'
          description: The item description that describes what the item is.
          example: Blue watch
        articleDescriptionCn:
          maxLength: 150
          type:
          - string
          - 'null'
          description: Chinese description of the article
          example: 中文货品
        unitValue:
          maximum: 10000000000
          minimum: 0.01
          type:
          - number
          - 'null'
          description: The retail price for a single unit of the product.
          format: double
          example: 10
        quantity:
          maximum: 1000
          minimum: 0
          type:
          - integer
          - 'null'
          description: The total quantity of the product units within the package.
          format: int32
          example: 1
        unitWeight:
          maximum: 1000
          minimum: 0
          type:
          - number
          - 'null'
          description: The total weight for a single unit of the product Related unit (Kg or Lb) is defined in field "weightUnit"
          format: double
          example: 0.1
        countryOfOrigin:
          maxLength: 2
          type:
          - string
          - 'null'
          description: 'The 2-character ISO country code in which the product was manufactured, as required by international customs specifications. See for more information: http://www.iso.org/iso/country_codes'
          example: DE
        harmonizedCode:
          maxLength: 20
          type:
          - string
          - 'null'
          description: The harmonized code required by international customs specifications. HS code or HST code ; depends on final carrier and customs requirements
          example: '910310'
        originPostalCode:
          type:
          - string
          - 'null'
          description: The postal code within the country where the product was manufactured. Can be requested if countryOfOrigin = CN and destination county = US
        originManufacturer:
          type:
          - string
          - 'null'
          description: The name of the product manufacturer. Can be requested if countryOfOrigin = CN and destination county = US
        destinationTariffCode:
          maxLength: 20
          type:
          - string
          - 'null'
          description: Destination tariff code used for import clearance purposes. VAT codes for VAT exemptions or reduced VAT can be filled here
          example: 'Exemption codes examples (IE destination):

            <br>6VTF = Reduced VAT Rate <br>6VTT = Second Reduced VAT Rate <br>6VTA = Agricultural VAT Rate <br>6VTZ = Zero VAT Rate '
        productURL:
          maxLength: 255
          type:
          - string
          - 'null'
          description: Direct link to the product page
          example: https://www.acme.com/SKU
        composition:
          type:
          - string
          - 'null'
          description: 'Example: 100% polyurethane, Cotton, aluminium'
          example: 100% polyurethane, Cotton, aluminium
        tradeItemNumber:
          type:
          - string
          - 'null'
          description: 'GTIN (Global Trade Item Number) or the article or ISBN (International Standard Book Number) for Books

            <br> GTIN: can be EAN (European Article Number) also called GTIN-13 or UPC (Universal Product Code) also called GTIN-12 and used in USA and Canada '
        tradeItemNumberType:
          allOf:
          - $ref: '#/components/schemas/tradeItemNumberTypeEnum'
          description: 'Type of trade item number. Possible value are: EAN, UPC, JAN or ISBN'
        fdaPriorNotice:
          maxLength: 12
          minLength: 12
          type:
          - string
          - 'null'
          description: FDA (US Food and Drug Administration) Prior Notice number (12c) A Prior Notice declaration must be done for each food or beverage article to the USA.
        hasBattery:
          type:
          - boolean
          - 'null'
          description: 'Parcel contains batterie True/False

            <br>Possible Values: true, false (default value if null)'
          example: false
        dgnFlag:
          type:
          - boolean
          - 'null'
          description: 'Dangerous Goods (DGN) flag true/false

            <br>Possible Values: true, false (default value if null)'
          example: true
        dgnCategory:
          maxLength: 20
          type:
          - string
          - 'null'
          description: Dangerous goods category
          example: Oxidizing substances
        dgnUnNumber:
          maxLength: 20
          type:
          - string
          - 'null'
          description: Unique reference for dangerous goods
          example: UN 1993
        dgnPInumber:
          maxLength: 6
          type:
          - string
          - 'null'
          description: Packing Instruction Number used by Ops
          example: PI 966
        dgnEccn:
          maxLength: 35
          type:
          - string
          - 'null'
          description: Export control classification number
          example: 9E003
        volatileOrganicCompoundInGrams:
          maximum: 2147483647
          minimum: 0
          type:
          - integer
          - 'null'
          description: Weight in grams of Volatile Organic Components (VOC) in the item. Optional field.
          format: int32
          example: 150
        dds:
          maxLength: 14
          minLength: 14
          type:
          - string
          - 'null'
          description: EU DDS Reference number
          example: ''
        certifierId:
          maxLength: 255
          type:
          - string
          - 'null'
          description: US Customs
          example: ''
        productId:
          maxLength: 255
          type:
          - string
          - 'null'
          description: US Customs
          example: ''
        certificateVersionId:
          maxLength: 255
          type:
          - string
          - 'null'
          description: US Customs
          example: ''
      additionalProperties: false
    parcelPackageLabel:
      type: object
      properties:
        ashid:
          type:
          - string
          - 'null'
          description: Asendia Unique Identifier. Applicable when a identifier number range has been pre-assigned to a customer. AHSID allocated to an order parcel can be used to track the parcel. ASHID is printed on label when possible
        barcodeReference:
          type:
          - string
          - 'null'
          description: Value you get when you scan main barcode on final mile label. For some final labels, barcode can be slightly different from tracking number. It is mandatory to provide value to allow 3rd party systems to scan label properly
        packageId:
          type:
          - string
          - 'null'
        trackingNumber:
          type:
          - string
          - 'null'
        labels:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/label'
      additionalProperties: false
    ukReturnsModel:
      type: object
      properties:
        returnsName:
          maxLength: 50
          type:
          - string
          - 'null'
          description: Name of the person or company where  parcels are returned to, usually to handle undeliverables
        returnsAddressLine1:
          maxLength: 50
          type:
          - string
          - 'null'
          description: The first line of the returns street address
        returnsAddressLine2:
          maxLength: 50
          type:
          - string
          - 'null'
          description: The second line of the returns street address
        returnsAddressLine3:
          maxLength: 50
          type:
          - string
          - 'null'
          description: The third line of the returns street address
        returnsCity:
          maxLength: 50
          type:
          - string
          - 'null'
          description: The city where the parcel is returned to
        returnsProvince:
          maxLength: 50
          type:
          - string
          - 'null'
          description: The state or province where the parcel is returned to
        returnsPostalCode:
          maxLength: 20
          type:
          - string
          - 'null'
          description: The package recipient's postal code
        returnsCountryCode:
          maxLength: 2
          minLength: 2
          type:
          - string
          - 'null'
          description: The 2-character ISO country code for the country where the parcel is returned to http://www.iso.org/iso/country_codes
      additionalProperties: false
    sellerModel:
      type: object
      properties:
        sellerFirstName:
          maxLength: 50
          type:
          - string
          - 'null'
          description: The parcel seller's first name
        sellerLastName:
          maxLength: 50
          type:
          - string
          - 'null'
          description: The parcel seller's last name
        sellerBusinessName:
          maxLength: 50
          type:
          - string
          - 'null'
          description: The parcel seller's company name
        sellerAddressLine1:
          maxLength: 50
          type:
          - string
          - 'null'
          description: The first line of the seller's street address
        sellerAddressLine2:
          maxLength: 50
          type:
          - string
          - 'null'
          description: The second line of the seller's street address
        sellerAddressLine3:
          maxLength: 50
          type:
          - string
          - 'null'
          description: The third line of the seller's street address
        sellerCity:
          maxLength: 50
          type:
          - string
          - 'null'
          description: The city of the seller's street address
        sellerProvince:
          maxLength: 50
          type:
          - string
          - 'null'
          description: The state or province of the seller's street address
        sellerPostalCode:
          maxLength: 20
          type:
          - string
          - 'null'
          description: The seller's postal code
        sellerCountryCode:
          maxLength: 2
          minLength: 2
          type:
          - string
          - 'null'
          description: 'The 2-character ISO country code for the seller''s street address. See for more information: http://www.iso.org/iso/country_codes'
        sellerPhoneNumber:
          maxLength: 25
          type:
          - string
          - 'null'
          description: The seller's phone number
        sellerMobileNumber:
          maxLength: 25
          type:
          - string
          - 'null'
          description: The seller's mobile phone number
        sellerEmail:
          maxLength: 50
          type:
          - string
          - 'null'
          description: The seller's email address
        sellerEORI:
          maxLength: 17
          type:
          - string
          - 'null'
          description: The seller's EORI (Economic Operator Registration and Identification) number
        sellerIOSS:
          type:
          - string
          - 'null'
          description: The seller's IOSS (Import One Stop Shop) number
        sellerTaxID:
          type:
          - string
          - 'null'
          description: The seller's Tax ID, VAT or GST number in destination country
          example: 222.259.895 or 222259895 for Switzerland
        sellerOriginTaxID:
          type:
          - string
          - 'null'
          description: The seller's Tax ID, VAT or GST number in country of origin
        sellerAEO:
          type:
          - string
          - 'null'
          description: The seller's AEO (Authorised Economic Operator) number
        sellerIdentificationNumber:
          type:
          - string
          - 'null'
          description: 'The seller''s company/business registration number in the destination country

            <br>Ex: Swiss UID

            Used to capture sender ABN/ARN in Australia'
          example: CHE-116.281.710 or CHE116281710
      additionalProperties: false
    returnsModel:
      type: object
      properties:
        returnsName:
          maxLength: 50
          type:
          - string
          - 'null'
          description: Name of the person or company where  parcels are returned to, usually to handle undeliverables
        returnsAddressLine1:
          maxLength: 50
          type:
          - string
          - 'null'
          description: The first line of the returns street address
        returnsAddressLine2:
          maxLength: 50
          type:
          - string
          - 'null'
          description: The second line of the returns street address
        returnsAddressLine3:
          maxLength: 50
          type:
          - string
          - 'null'
          description: The third line of the returns street address
        returnsCity:
          maxLength: 50
          type:
          - string
          - 'null'
          description: The city where the parcel is returned to
        returnsProvince:
          maxLength: 50
          type:
          - string
          - 'null'
          description: The state or province where the parcel is returned to
        returnsPostalCode:
          maxLength: 20
          type:
          - string
          - 'null'
          description: The package recipient's postal code
        returnsCountryCode:
          maxLength: 2
          minLength: 2
          type:
          - string
          - 'null'
          description: The 2-character ISO country code for the country where the parcel is returned to http://www.iso.org/iso/country_codes
      additionalProperties: false
    postCustomerParcelRequestModel:
      type: object
      properties:
        createParcelRequest:
          allOf:
          - $ref: '#/components/schemas/customerParcelRequestModel'
      additionalProperties: false
    ukFeesModel:
      type: object
      properties:
        feeAmount:
          pattern: ^(0|-?\d{0,7}(\.\d{0,2})?)$
          type:
          - number
          - 'null'
          description: Fee amount for the selected type (see feeType). Related currency is defined in feeCurrencyCode Multiple entries are possible
          format: double
          example: 50
        feeType:
          maxLength: 20
          type:
          - string
          - 'null'
          description: 'Fee type. Multiple entries are possible. Possible types are:

            <br>Possible Values: COD, FreightFee, AdminFee,ShippingCost, InsuranceAmount, VATamount, TobaccoTax, AlcoholTax, OtherExciseTax, CustomsDuties'
          example: ShippingCost
        feeCurrencyCode:
          maxLength: 3
          minLength: 3
          type:
          - string
          - 'null'
          description: ISO 3 currency code applicable to fee amount
          example: USD
      additionalProperties: false
    parcelRequestModel:
      required:
      - accountNumber
      - labelType
      - productCode
      type: object
      properties:
        accountNumber:
          maxLength: 12
          type: string
          description: Asendia's account number designated for the shipper. This will be provided at account setup.
          example: US21110012
        subAccountNumber:
          maxLength: 12
          type:
          - string
          - 'null'
          description: Asendia's sub account number designated for the shipper, if applicable. This will be provided at account setup.
        processingPoint:
          type:
          - string
          - 'null'
          description: The Asendia's location code where the physical package will be processed
          example: SCL
        isDirectAccess:
          type:
          - boolean
          - 'null'
          description: 'Signifyes wheter this parcel is Direct Access or not

            <br>Possible Values: true, false (default value if null)<example>false</example>'
        includeRate:
          type:
          - boolean
          - 'null'
          description: 'Signifyes whether or not to send back the Rate for this parcel.

            <br>Possible Values: true, false (default value if null)'
          example: false
        labelType:
          type: string
          description: 'This is the preferred format for the returned label. Available formats are PDF, PNG, ZPL and ZPL300

            <br>Possible Values: [ PDF, PNG, ZPL, ZPL300 ]'
          example: PNG
        labelRotation:
          type:
          - integer
          - 'null'
